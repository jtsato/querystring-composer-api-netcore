0022ready\u0022];\n\n    private static async Task Main(string[] args)\n    {\n        WebApplicationBuilder builder = WebApplication.CreateBuilder(args);\n\n        builder.Services.Configure\u003CApiBehaviorOptions\u003E(options =\u003E\n        {\n            options.SuppressInferBindingSourcesForParameters = true;\n            options.SuppressModelStateInvalidFilter = true;\n        });\n\n        builder.Services.AddHttpLogging(GetHttpLoggingOptions);\n\n        builder.Services\n            .AddControllers(options =\u003E\n        {\n            options.Filters.Add\u003CGetLanguageActionFilterAttribute\u003E();\n            options.Filters.Add\u003CHandleInvalidModelStateActionFilterAttribute\u003E();\n            options.Filters.Add\u003CExceptionHandlerFilterAttribute\u003E();\n                options.Filters.Add\u003CGetUserActionFilter\u003E();\n            })\n            .AddJsonOptions(options =\u003E\n            {\n                options.JsonSerializerOptions.PropertyNamingPolicy = JsonNamingPolicy.CamelCase;\n        });\n\n        builder.Services.AddHttpContextAccessor();\n\n        builder.Services.AddEndpointsApiExplorer();\n        if (builder.Environment.IsDevelopment() || builder.Environment.IsStaging())\n        {\n            builder.Services.AddSwaggerGen(ConfigureSwaggerGen);\n        }\n\n        builder.Services.AddHealthChecks()\n            .AddCheck(\u0022Health check\u0022, () =\u003E HealthCheckResult.Healthy(), tags: HealthCheckTags);\n\n        Dictionary\u003CType, ServiceLifetime\u003E lifetimeByType = DependencyInjector.ConfigureServices(builder.Services);\n\n        builder.Services.AddCors(options =\u003E\n        {\n            options.AddPolicy(\u0022CorsPolicy\u0022,\n                policy =\u003E\n                {\n                    policy.WithOrigins\n                        (\n                            \u0022https://patolar.com.br\u0022,\n                            \u0022https://www.patolar.com.br\u0022,\n                            \u0022https://app.patolar.com.br\u0022,\n                            \u0022https://api.patolar.com.br\u0022,\n                            \u0022https://patolar-dev.flutterflow.app\u0022,\n                            \u0022https://app.flutterflow.io\u0022,\n                            \u0022https://ff-debug-service-frontend-free-ygxkweukma-uc.a.run.app\u0022,\n                            \u0022https://ff-debug-service-frontend-pro-ygxkweukma-uc.a.run.app\u0022,\n                            \u0022http://localhost:8000\u0022\n                        )\n                        .AllowAnyHeader()\n                        .AllowAnyMethod()\n                        .AllowCredentials();\n                });\n        });\n\n        WebApplication app = builder.Build();\n\n        await EnsureIndexesAsync(app.Services.GetService(typeof(IRepository\u003CClientEntity\u003E)));\n        await EnsureIndexesAsync(app.Services.GetService(typeof(ISequenceRepository\u003CClientSequence\u003E)));\n        await EnsureIndexesAsync(app.Services.GetService(typeof(IRepository\u003CQueryStructureEntity\u003E)));\n        await EnsureIndexesAsync(app.Services.GetService(typeof(ISequenceRepository\u003CQueryStructureSequence\u003E)));\n\n        app.UseCors(\u0022CorsPolicy\u0022);\n\n        if (app.Services.GetService(typeof(IServiceResolver)) is ServiceResolver serviceResolver)\n        {\n            serviceResolver.Setup(app.Services, lifetimeByType);\n        }\n\n        if (app.Environment.IsDevelopment() || app.Environment.IsStaging())\n        {\n            app.UseSwagger(ConfigureSwagger);\n            app.UseSwaggerUI(options =\u003E\n            {\n                options.RoutePrefix = \u0022api/querystring-composer/v1/swagger\u0022;\n                options.SwaggerEndpoint(\u0022/api/querystring-composer/v1/api-docs/v1/swagger.yaml\u0022, \u0022QueryString Composer API\u0022);\n            });\n            RewriteOptions rewriteOptions = new RewriteOptions();\n            rewriteOptions.AddRedirect(\u0022^$\u0022, \u0022swagger\u0022);\n            app.UseRewriter(rewriteOptions);\n        }\n\n        app.MapControllers();\n        app.UsePathBase(new PathString(\u0022/api/querystring-composer\u0022));\n        app.UseRouting();\n\n        app.UseWhen(\n            httpContext =\u003E !httpContext.Request.Path.StartsWithSegments(\u0022/health-check\u0022),\n            appBuilder =\u003E appBuilder.UseHttpLogging()\n        );\n\n        app.UseAuthorization();\n        app.MapHealthChecks\n        (\n            \u0022/health-check/live\u0022,\n            new HealthCheckOptions {Predicate = healthCheck =\u003E healthCheck.Tags.Contains(\u0022live\u0022)}\n        );\n        app.MapHealthChecks\n        (\n            \u0022/health-check/ready\u0022,\n            new HealthCheckOptions {Predicate = healthCheck =\u003E healthCheck.Tags.Contains(\u0022ready\u0022)}\n        );\n\n        await app.RunAsync();\n    }\n\n    private static async Task EnsureIndexesAsync(object repository)\n    {\n        if (repository is IIndexInitializer indexInitializer)\n        {\n            await indexInitializer.EnsureIndexesAsync();\n        }\n    }\n\n    private static void ConfigureSwaggerGen(SwaggerGenOptions options)\n    {\n        options.EnableAnnotations();\n\n        options.SwaggerDoc(\u0022v1\u0022, new OpenApiInfo\n        {\n            Title = \u0022QueryString Composer API\u0022,\n            Version = \u0022v1\u0022,\n            Description = \u0022QueryString Composer API\u0022,\n        });\n\n        options.AddSecurityDefinition(\u0022Bearer\u0022, new OpenApiSecurityScheme\n        {\n            Name = \u0022Authorization\u0022,\n            In = ParameterLocation.Header,\n            Type = SecuritySchemeType.Http,\n            Scheme = \u0022Bearer\u0022,\n            BearerFormat = \u0022JWT\u0022,\n            Description = \u0022JWT Authorization header using the Bearer scheme.\u0022\n        });\n\n        // Swashbuckle 10 resolves the requirement per document, so the scheme is referenced by id.\n        options.AddSecurityRequirement(_ =\u003E new OpenApiSecurityRequirement\n        {\n            {\n                new OpenApiSecuritySchemeReference(\u0022Bearer\u0022), []\n            }\n        });\n\n        options.OperationFilter\u003CLanguageOperationFilter\u003E();\n        options.OperationFilter\u003CCorrelationIdOperationFilter\u003E();\n        options.DocInclusionPredicate((_, api) =\u003E !string.IsNullOrWhiteSpace(api.GroupName));\n        options.TagActionsBy(api =\u003E [api.GroupName]);\n\n        string[] methodsOrder = [\u0022post\u0022, \u0022put\u0022, \u0022patch\u0022, \u0022delete\u0022, \u0022get\u0022, \u0022options\u0022, \u0022trace\u0022];\n        options.OrderActionsBy(apiDesc =\u003E $\u0022{Array.IndexOf(methodsOrder, apiDesc.HttpMethod.ToLower())}_{apiDesc.HttpMethod}\u0022);\n    }\n\n    private static void ConfigureSwagger(SwaggerOptions options)\n    {\n        options.RouteTemplate = \u0022api/querystring-composer/v1/api-docs/{documentName}/swagger.yaml\u0022;\n\n        options.PreSerializeFilters.Add((swagger, httpReq) =\u003E\n        {\n            swagger.Servers = new List\u003COpenApiServer\u003E\n            {\n                new OpenApiServer {Url = $\u0022{httpReq.Scheme}://{httpReq.Host.Value}/api/querystring-composer\u0022}\n            };\n        });\n    }\n\n    private static void GetHttpLoggingOptions(HttpLoggingOptions options)\n    {\n        options.LoggingFields = HttpLoggingFields.RequestPath\n                                | HttpLoggingFields.RequestQuery\n                                | HttpLoggingFields.RequestMethod\n                                | HttpLoggingFields.RequestBody\n                                | HttpLoggingFields.ResponseStatusCode\n                                | HttpLoggingFields.ResponseHeaders\n                                | HttpLoggingFields.RequestHeaders\ n (ObjectResult) await method.Invoke();\r\n        }\r\n        catch (Exception exception)\r\n        {\r\n            return (ObjectResult) await _exceptionHandler.HandleAsync(exception);\r\n        }\r\n        finally\r\n        {\r\n            useCultureAttribute.After(method.Method);\r\n        }\r\n    }\r\n}","tests":[]},"/home/runner/work/querystring-composer-api-netcore/querystring-composer-api-netcore/src/test/IntegrationTest.EntryPoint.WebApi/Commons/ApiMethodInvokerHolder.cs":{"language":"cs","source":"using System.Diagnostics.CodeAnalysis;\r\nusing EntryPoint.WebApi.Commons.Exceptions;\r\n\r\nnamespace IntegrationTest.EntryPoint.WebApi.Commons;\r\n\r\n[SuppressMessage(\u0022ReSharper\u0022, \u0022ClassNeverInstantiated.Global\u0022)]\r\npublic sealed class ApiMethodInvokerHolder\r\n{\r\n    private ApiMethodInvoker _invoker;\r\n\r\n    public ApiMethodInvoker GetApiMethodInvoker()\r\n    {\r\n        return _invoker ??= new ApiMethodInvoker(new ExceptionHandler());\r\n    }\r\n}","tests":[]},"/home/runner/work/querystring-composer-api-netcore/querystring-composer-api-netcore/src/test/IntegrationTest.EntryPoint.WebApi/Commons/ApiMethodTestHelper.cs":{"language":"cs","source":"using System.Text.Json;\r\nusing Microsoft.AspNetCore.Mvc;\r\nusing Xunit;\r\n\r\nnamespace IntegrationTest.EntryPoint.WebApi.Commons;\r\n\r\npublic static class ApiMethodTestHelper\r\n{\r\n    public static JsonElement TryGetJsonElement(ObjectResult objectResult)\r\n    {\r\n        JsonSerializerOptions options = new JsonSerializerOptions {PropertyNamingPolicy = JsonNamingPolicy.CamelCase};\r\n        string jsonAsString = JsonSerializer.Serialize(objectResult.Value, options);\r\n\r\n        JsonDocument jsonDocument = JsonDocument.Parse(jsonAsString);\r\n        Assert.NotNull(jsonDocument);\r\n\r\n        return jsonDocument.RootElement;\r\n    }\r\n}","tests":[]},"/home/runner/work/querystring-composer-api-netcore/querystring-composer-api-netcore/src/test/IntegrationTest.EntryPoint.WebApi/Commons/Assertions/AssertionException.cs":{"language":"cs","source":"using System;\r\nusing System.Diagnostics.CodeAnalysis;\r\n\r\nnamespace IntegrationTest.EntryPoint.WebApi.Commons.Assertions;\r\n\r\n[ExcludeFromCodeCoverage]\r\npublic sealed class AssertionException(string stackTrace, string message = null) : Exception(message)\r\n{\r\n    public override string StackTrace { get; } = stackTrace;\r\n\r\n}","tests":[]},"/home/runner/work/querystring-composer-api-netcore/querystring-composer-api-netcore/src/test/IntegrationTest.EntryPoint.WebApi/Commons/Assertions/AssertType.cs":{"language":"cs","source":"namespace IntegrationTest.EntryPoint.WebApi.Commons.Assertions;\r\n\r\npublic enum AssertType\r\n{\r\n    Equal,\r\n    StartWith,\r\n    Empty,\r\n    NotEmpty,\r\n    Single,\r\n    Count,\r\n    Null\r\n}","tests":[]},"/home/runner/work/querystring-composer-api-netcore/querystring-composer-api-netcore/src/test/IntegrationTest.EntryPoint.WebApi/Commons/Assertions/ExceptionExtensions.cs":{"language":"cs","source":"using System;\r\nusing System.Diagnostics;\r\nusing System.Reflection;\r\n\r\nnamespace IntegrationTest.EntryPoint.WebApi.Commons.Assertions;\r\n\r\npublic static class ExceptionExtensions\r\n{\r\n    private static readonly FieldInfo FieldInfo = typeof(Exception).GetField(\u0022_stackTraceString\u0022, BindingFlags.NonPublic | BindingFlags.Instance);\r\n    private static readonly Type Type = typeof(StackTrace).GetNestedType(\u0022TraceFormat\u0022, BindingFlags.NonPublic);\r\n\r\n    private static readonly MethodInfo MethodInfo =\r\n        typeof(StackTrace).GetMethod(\u0022ToString\u0022, BindingFlags.NonPublic | BindingFlags.Instance, null, [Type], null);\r\n\r\n    public static Exception SetStackTrace(this Exception target, StackTrace stack)\r\n    {\r\n        object stackTraceAsString = MethodInfo.Invoke(stack, [Enum.GetValues(Type).GetValue(0)]);\r\n        FieldInfo.SetValue(target, stackTraceAsString);\r\n        return target;\r\n    }\r\n}","tests":[]},"/home/runner/work/querystring-composer-api-netcore/querystring-composer-api-netcore/src/test/IntegrationTest.EntryPoint.WebApi/Commons/Assertions/Is.cs":{"language":"cs","source":"namespace IntegrationTest.EntryPoint.WebApi.Commons.Assertions;\r\n\r\npublic readonly struct Is\u003CT\u003E\r\n{\r\n    public AssertType AssertType { get; }\r\n    public T Expected { get; }\r\n\r\n    private Is(AssertType assertType)\r\n    {\r\n        AssertType = assertType;\r\n        Expected = default;\r\n    }\r\n\r\n    private Is(AssertType assertType, T expected)\r\n    {\r\n        AssertType = assertType;\r\n        Expected = expected;\r\n    }\r\n\r\n    public static Is\u003CT\u003E EqualTo(T excepted)\r\n    {\r\n        return new Is\u003CT\u003E(AssertType.Equal, excepted);\r\n    }\r\n\r\n    public static Is\u003CT\u003E StartWith(T excepted)\r\n    {\r\n        return new Is\u003CT\u003E(AssertType.StartWith, excepted);\r\n    }\r\n\r\n    public static Is\u003CT\u003E Empty()\r\n    {\r\n        return new Is\u003CT\u003E(AssertType.Empty);\r\n    }\r\n\r\n    public static Is\u003CT\u003E NotEmpty()\r\n    {\r\n        return new Is\u003CT\u003E(AssertType.NotEmpty);\r\n    }\r\n\r\n    public static Is\u003CT\u003E Single()\r\n    {\r\n        return new Is\u003CT\u003E(AssertType.Single);\r\n    }\r\n\r\n    public static Is\u003Cint\u003E Count(int excepted)\r\n    {\r\n        return new Is\u003Cint\u003E(AssertType.Count, excepted);\r\n    }\r\n\r\n    public static Is\u003CT\u003E Null()\r\n    {\r\n        return new Is\u003CT\u003E(AssertType.Null);\r\n    }\r\n}","tests":[]},"/home/runner/work/querystring-composer-api-netcore/querystring-composer-api-netcore/src/test/IntegrationTest.EntryPoint.WebApi/Commons/Assertions/JsonAssertHelper.cs":{"language":"cs","source":"using System;\r\nusing System.Diagnostics;\r\nusing System.Diagnostics.CodeAnalysis;\r\nusing System.Text.Json;\r\nusing Core.Commons;\r\nusing Core.Commons.Extensions;\r\nusing Xunit;\r\n\r\nnamespace IntegrationTest.EntryPoint.WebApi.Commons.Assertions;\r\n\r\n[SuppressMessage(\u0022ReSharper\u0022, \u0022AssignNullToNotNullAttribute\u0022)]\r\npublic sealed class JsonAssertHelper\r\n{\r\n    private readonly JsonElement _jsonElement;\r\n\r\n    private JsonAssertHelper(JsonElement jsonElement)\r\n    {\r\n        _jsonElement = jsonElement;\r\n    }\r\n\r\n    public static JsonAssertHelper AssertThat(JsonElement jsonElement)\r\n    {\r\n        return new JsonAssertHelper(jsonElement);\r\n    }\r\n\r\n    [ExcludeFromCodeCoverage]\r\n    public JsonAssertHelper AndExpectThat\u003CT\u003E(JsonFrom jsonFrom, Is\u003CT\u003E matcher)\r\n    {\r\n        return matcher.AssertType switch\r\n        {\r\n            AssertType.Equal =\u003E Equal(jsonFrom.JsonPath, matcher.Expected),\r\n            AssertType.StartWith =\u003E StartWith(jsonFrom.JsonPath, matcher.Expected),\r\n            AssertType.Empty =\u003E Empty(jsonFrom.JsonPath),\r\n            AssertType.NotEmpty =\u003E NotEmpty(jsonFrom.JsonPath),\r\n            AssertType.Single =\u003E Single(jsonFrom.JsonPath),\r\n            AssertType.Count =\u003E Count(jsonFrom.JsonPath, Convert.ToInt32(matcher.Expected)),\r\n            AssertType.Null =\u003E Null(jsonFrom.JsonPath),\r\n            _ =\u003E throw new InvalidOperationException()\r\n        };\r\n    }\r\n\r\n    private JsonAssertHelper Equal\u003CT\u003E(string path, T excepted)\r\n    {\r\n        try\r\n        {\r\n            ArgumentValidator.CheckNull(_jsonElement.SelectToken(path), path);\r\n            Assert.Equal(excepted, _jsonElement.SelectToken(path).ToObject\u003CT\u003E());\r\n            return this;\r\n        }\r\n        catch (Exception exception)\r\n        {\r\n            throw CreateAssertionException(path, excepted, exception);\r\n        }\r\n    }\r\n\r\n    private JsonAssertHelper StartWith\u003CT\u003E(string path, T excepted)\r\n    {\r\n        try\r\n        {\r\n            ArgumentValidator.CheckNull(_jsonElement.SelectToken(path), path);\r\n            Assert.StartsWith(excepted.ToString(), _jsonElement.SelectToken(path).ToString());\r\n            return this;\r\n        }\r\n        catch (Exception exception)\r\n        {\r\n            throw CreateAssertionException(path, excepted, exception);\r\n        }\r\n    }\r\n\r\n    private JsonAssertHelper Empty(string path)\r\n    {\r\n        try\r\n        {\r\n            ArgumentValidator.CheckNull(_jsonElement.SelectToken(path), path);\r\n            if (_jsonElement.SelectToken(path).ValueKind == JsonValueKind.Array)\r\n            {\r\n                Assert.Empty(_jsonElement.SelectToken(path).EnumerateArray());\r\n                return this;\r\n            }\r\n\r\n            if (_jsonElement.SelectToken(path).ValueKind == JsonValueKind.Null)\r\n            {\r\n                return this;\r\n            }\r\n\r\n            Assert.True(string.IsNullOrWhiteSpace(_jsonElement.SelectToken(path).ToString()));\r\n            return this;\r\n        }\r\n        catch (Exception exception)\r\n        {\r\n            throw CreateAssertionException(path, \u0022EMPTY\u0022, exception);\r\n        }\r\n    }\r\n\r\n    private JsonAssertHelper NotEmpty(string path)\r\n    {\r\n        try\r\n        {\r\n            ArgumentValidator.CheckNull(_jsonElement.SelectToken(path), path);\r\n            if (_jsonElement.SelectToken(path).ValueKind == JsonValueKind.Array)\r\n            {\r\n                Assert.NotEmpty(_jsonElement.SelectToken(path).EnumerateArray());\r\n                return this;\r\n            }\r\n\r\n            Assert.False(_jsonElement.SelectToken(path).ValueKind == JsonValueKind.Null);\r\n            if (_jsonElement.SelectToken(path).ValueKind != JsonValueKind.String) return this;\r\n            Assert.False(string.IsNullOrWhiteSpace(_jsonElement.SelectToken(path).ToString()));\r\n            return this;\r\n        }\r\n        catch (Exception exception)\r\n        {\r\n            throw CreateAssertionException(path, \u0022NotEmpty\u0022, exception);\r\n        }\r\n    }\r\n\r\n    private JsonAssertHelper Single(string path)\r\n    {\r\n        try\r\n        {\r\n            ArgumentValidator.CheckNull(_jsonElement.SelectToken(path), path);\r\n            Assert.Single(_jsonElement.SelectToken(path).EnumerateArray());\r\n            return this;\r\n        }\r\n        catch (Exception exception)\r\n        {\r\n            throw CreateAssertionException(path, \u0022Single\u0022, exception);\r\n        }\r\n    }\r\n\r\n    private JsonAssertHelper Count(string path, int excepted)\r\n    {\r\n        try\r\n        {\r\n            ArgumentValidator.CheckNull(_jsonElement.SelectToken(path), path);\r\n            Assert.Equal(excepted, _jsonElement.SelectToken(path).GetArrayLength());\r\n            return this;\r\n        }\r\n        catch (Exception exception)\r\n        {\r\n            throw CreateAssertionException(path, excepted, exception);\r\n        }\r\n    }\r\n\r\n    private JsonAssertHelper Null(string path)\r\n    {\r\n        try\r\n        {\r\n            ArgumentValidator.CheckNull(_jsonElement.SelectToken(path), path);\r\n            Assert.True(_jsonElement.SelectToken(path).ValueKind == JsonValueKind.Null);\r\n            return this;\r\n        }\r\n        catch (Exception exception)\r\n        {\r\n            throw CreateAssertionException(path, \u0022Null\u0022, exception);\r\n        }\r\n    }\r\n\r\n    private static AssertionException CreateAssertionException\u003CT\u003E(string path, T excepted, Exception exception, string message = null)\r\n    {\r\n        StackTrace stackTrace = new StackTrace(3, true);\r\n        exception.SetStackTrace(stackTrace);\r\n        return new AssertionException(exception.StackTrace, $\u0022Assertion Failed: Path {path} expected to be {excepted}. Cause: {message ?? exception.Message}\u0022);\r\n    }\r\n}","tests":[]},"/home/runner/work/queryst \u0022ReSharper\u0022, \u0022ClassNeverInstantiated.Global\u0022)]\r\npublic sealed class CoreMessageKeysFixture : IDisposable\r\n{\r\n    private static readonly string CoreProjectFolder = GetProjectsByCsprojFile.Projects[\u0022Core\u0022];\r\n    private static readonly string CoreDomainFolder = $\u0022{CoreProjectFolder}/Domains\u0022;\r\n    \r\n    private List\u003Cstring\u003E _messageKeys;\r\n\r\n    private bool _disposed;\r\n\r\n    ~CoreMessageKeysFixture() =\u003E Dispose(false);\r\n\r\n    public void Dispose()\r\n    {\r\n        Dispose(true);\r\n        GC.SuppressFinalize(this);\r\n    }\r\n\r\n    [ExcludeFromCodeCoverage]\r\n    private void Dispose(bool disposing)\r\n    {\r\n        if (_disposed || !disposing) return;\r\n        _disposed = true;\r\n    }\r\n\r\n    public IEnumerable\u003Cstring\u003E GetCoreProjectMessageKeys()\r\n    {\r\n        return _messageKeys ??= LoadCoreProjectMessageKeys();\r\n    }\r\n\r\n    private static List\u003Cstring\u003E LoadCoreProjectMessageKeys()\r\n    {\r\n        string[] pathToFiles = Directory.GetFiles(CoreDomainFolder, \u0022*.cs\u0022, SearchOption.AllDirectories);\r\n\r\n        List\u003Cstring\u003E messageKeys =\r\n        [\r\n            .. from pathToFile in pathToFiles\r\n            from line in File.ReadLines(pathToFile)\r\n            where line.Contains(\u0022Exception(\\\u0022\u0022) || line.Contains(\u0022WithMessage(\\\u0022\u0022)\r\n            select line.Contains(\u0022Exception(\\\u0022\u0022)\r\n                ? line.SubstringAfter(\u0022Exception(\\\u0022\u0022).SubstringBefore(\u0022\\\u0022\u0022)\r\n                : line.SubstringAfter(\u0022WithMessage(\\\u0022\u0022).SubstringBefore(\u0022\\\u0022\u0022)\r\n        ];\r\n\r\n        messageKeys.Sort();\r\n\r\n        return [.. messageKeys.Distinct()];\r\n    }\r\n}","tests":[]},"/home/runner/work/querystring-composer-api-netcore/querystring-composer-api-netcore/src/test/IntegrationTest.EntryPoint.WebApi/Commons/ExceptionHandlerTest.cs":{"language":"cs","source":"using System;\nusing System.Collections.Generic;\nusing System.Net;\nusing System.Text.Json;\nusing System.Threading.Tasks;\nusing Core.Commons.Models;\nusing Core.Exceptions;\nusing EntryPoint.WebApi.Commons.Exceptions;\nusing EntryPoint.WebApi.Commons.Models;\nusing FluentValidation;\nusing FluentValidation.Results;\nusing IntegrationTest.EntryPoint.WebApi.Commons.Assertions;\nusing Microsoft.AspNetCore.Mvc;\nusing Xunit;\n\nnamespace IntegrationTest.EntryPoint.WebApi.Commons;\n\n[Collection(\u0022WebApi Collection [NoContext]\u0022)]\npublic sealed class ExceptionHandlerTest\n{\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Fact(DisplayName = \u0022Fail to format message if key not exists in the ResourceFile\u0022)]\n    public void FailToFormatMessageIfKeyNotExistsInTheResourceFile()\n    {\n        // Arrange\n        // Act \n        // Assert\n        Assert.Equal(\u0022unknownKey\u0022, IExceptionHandler.MessageFormatter(\u0022unknownKey\u0022));\n        Assert.Equal(\u0022unknownKey\u0022, IExceptionHandler.MessageFormatter(\u0022unknownKey\u0022, null));\n        Assert.Equal(\u0022unknownKey\u0022, IExceptionHandler.MessageFormatter(\u0022unknownKey\u0022, \u0022One\u0022, \u0022Two\u0022, \u0022Three\u0022));\n    }\n\n    [UseCulture(\u0022en-US\u0022, \u0022en-US\u0022)]\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Fact(DisplayName = \u0022Successful to format message if key exists in the ResourceFile for default culture\u0022)]\n    public void SuccessfulToFormatMessageIfKeyExistsInTheResourceFileForDefaultCulture()\n    {\n        // Arrange\n        // Act \n        // Assert\n        Assert.Equal(\u0022Please correct the errors and send your information again!\u0022,\n            IExceptionHandler.MessageFormatter(\u0022CommonValidationAlert\u0022));\n\n        Assert.Equal(\u0022An unexpected error has occurred, please try again later!\u0022,\n            IExceptionHandler.MessageFormatter(\u0022CommonUnexpectedException\u0022));\n\n        Assert.Equal(\u0022An unexpected error has occurred, please try again later! Details: Value cannot be null or empty. (Parameter \u0027DummyParameter\u0027).\u0022,\n            IExceptionHandler.MessageFormatter(\u0022CommonUnexpectedExceptionWithParams\u0022, \u0022Value cannot be null or empty. (Parameter \u0027DummyParameter\u0027)\u0022));\n    }\n\n    [UseCulture(\u0022pt-BR\u0022, \u0022pt-BR\u0022)]\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Fact(DisplayName = \u0022Successful to format message if key exists in the ResourceFile for pt-BR culture\u0022)]\n    public void SuccessfulToFormatMessageIfKeyExistsInTheResourceFileForPtBrCulture()\n    {\n        // Arrange\n        // Act \n        // Assert\n        Assert.Equal(\u0022Favor corrigir os erros e enviar os dados novamente!\u0022,\n            IExceptionHandler.MessageFormatter(\u0022CommonValidationAlert\u0022));\n\n        Assert.Equal(\u0022Ocorreu um erro inesperado, por favor tente novamente mais tarde!\u0022,\n            IExceptionHandler.MessageFormatter(\u0022CommonUnexpectedException\u0022));\n\n        Assert.Equal(\u0022Ocorreu um erro inesperado, por favor tente novamente mais tarde! Detalhes: Value cannot be null or empty. (Parameter \u0027DummyParameter\u0027).\u0022,\n            IExceptionHandler.MessageFormatter(\u0022CommonUnexpectedExceptionWithParams\u0022, \u0022Value cannot be null or empty. (Parameter \u0027DummyParameter\u0027)\u0022));\n    }\n\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Fact(DisplayName = \u0022Successful to build http response status\u0022)]\n    public void SuccessfulToBuildHttpResponseStatus()\n    {\n        // Arrange\n        // Act \n        // Assert\n        Assert.Equal(new ResponseStatus((int) HttpStatusCode.BadRequest, \u0022Please correct the errors and send your information again!\u0022),\n            IExceptionHandler.BuildHttpResponseStatus(HttpStatusCode.BadRequest, \u0022Please correct the errors and send your information again!\u0022));\n\n        Assert.Equal(new ResponseStatus((int) HttpStatusCode.BadRequest, \u0022Please correct the errors and send your information again!\u0022),\n            IExceptionHandler.BuildHttpResponseStatus(HttpStatusCode.BadRequest, \u0022Please correct the errors and send your information again!\u0022,\n                new ValidationException(\u0022\u0022)));\n    }\n\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Fact(DisplayName = \u0022Successful to build http response status handling validation exception\u0022)]\n    public void SuccessfulToBuildHttpResponseStatusHandlingValidationException()\n    {\n        ValidationException validationException = new ValidationException(new List\u003CValidationFailure\u003E\n        {\n            new ValidationFailure(\u0022id\u0022, \u0022The identifier is required.\u0022)\n        });\n\n        ResponseStatus expected = new ResponseStatus((int) HttpStatusCode.BadRequest, \u0022Please correct the errors and send your information again!\u0022);\n        expected.Fields.Add(new Field(\u0022id\u0022, \u0022The identifier is required.\u0022, null));\n\n        Assert.Equal(expected, IExceptionHandler.BuildHttpResponseStatus(\n            HttpStatusCode.BadRequest, \u0022Please correct the errors and send your information again!\u0022, validationException));\n    }\n\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Fact(DisplayName = \u0022Successful to build http response status handling validation exception with nested object\u0022)]\n    public void SuccessfulToBuildHttpResponseStatusHandlingValidationExceptionWithNestedObject()\n    {\n        ValidationException validationException = new ValidationException(new List\u003CValidationFailure\u003E\n        {\n            new ValidationFailure(\u0022dummy.id\u0022, \u0022The identifier is required.\u0022)\n        });\n\n        ResponseStatus expected = new ResponseStatus((int) HttpStatusCode.BadRequest, \u0022Please correct the errors and send your information again!\u0022);\n        expected.Fields.Add(new Field(\u0022id\u0022, \u0022The identifier is required.\u0022, null));\n\n        Assert.Equal(expected, IExceptionHandler.BuildHttpResponseStatus(\n            HttpStatusCode.BadRequest, \u0022Please correct the errors and send your information again!\u0022, validationException));\n    }\n\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Fact(DisplayName = \u0022Successful to build http response status handling invalid argument exception\u0022)]\n    public void SuccessfulToBuildHttpResponseStatusHandlingInvalidArgumentException()\n    {\n        InvalidArgumentException invalidArgumentException = new InvalidArgumentException(\u0022Please correct the errors and send your information again!\u0022,\n            new List\u003CFieldError\u003E\n            {\n                new FieldError\n                {\n                    PropertyName = \u0022id\u0022,\n                    ErrorMessage = \u0022The identifier is required.\u0022,\n                }\n            });\n\n        ResponseStatus expected = new ResponseStatus((int) HttpStatusCode.BadRequest, \u0022Please correct the errors and send your information again!\u0022);\n        expected.Fields.Add(new Field(\u0022id\u0022, \u0022The identifier is required.\u0022, null));\n\n        Assert.Equal(expected, IExceptionHandler.BuildHttpResponseStatus(\n            HttpStatusCode.BadRequest, \u0022Please correct the errors and send your information again!\u0022, invalidArgumentException));\n    }\n\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Theory(DisplayName = \u0022Successful to handle exception\u0022)]\n    [InlineData(typeof(ParentConstraintException), HttpStatusCode.BadRequest)]\n    [InlineData(typeof(UniqueConstraintException), HttpStatusCode.BadRequest)]\n    [InlineData(typeof(InvalidArgumentException), HttpStatusCode.BadRequest)]\n    [InlineData(typeof(ValidationException), HttpStatusCode.BadRequest)]\n    [InlineData(typeof(AccessDeniedException), HttpStatusCode.Unauthorized)]\n    [InlineData(typeof(NotFoundException), HttpStatusCode.NotFound)]\n    [InlineData(typeof(ServiceUnavailableException), HttpStatusCode.InternalServerError)]\n    [InlineData(typeof(Exception), HttpStatusCode.InternalServerError)]\n    public async Task SuccessfulToHandleException(Type type, HttpStatusCode expectedHttpStatusCode)\n    {\n        // Arrange\n        ExceptionHandler exceptionHandler = new ExceptionHandler();\n\n        // Act \n        IActionResult actionResult = await exceptionHandler.HandleAsync(CreateExceptionByType(type));\n        ObjectResult objectResult = (ObjectResult) actionResult;\n\n        // Assert\n        Assert.NotNull(objectResult);\n        Assert.Equal((int) expectedHttpStatusCode, objectResult.StatusCode);\n\n        Assert.NotNull(objectResult.Value);\n\n        JsonElement jsonElement = ApiMethodTestHelper.TryGetJsonElement(objectResult);\n\n        JsonAssertHelper.AssertThat(jsonElement)\n            .AndExpectThat(JsonFrom.Path(\u0022$.code\u0022), Is\u003Cint\u003E.EqualTo((int) expectedHttpStatusCode))\n            .AndExpectThat(JsonFrom.Path(\u0022$.fields\u0022), Is\u003Cobject\u003E.Empty());\n    }\n\n    private static Exception CreateExceptionByType(Type type)\n    {\n        if (type == typeof(ValidationException))\n            return CreateInstance\u003CValidationException\u003E(\u0022CommonValidationAlert\u0022);\n\n        const string messageKey = \u0022CommonUnexpectedException\u0022;\n\n        if (type == typeof(InvalidArgumentException))\n            return CreateInstance\u003CInvalidArgumentException\u003E(messageKey, new List\u003CFieldError\u003E(0));\n\n        if (type == typeof(ParentConstraintException))\n            return CreateInstance\u003CParentConstraintException\u003E(messageKey);\n\n        if (type == typeof(UniqueConstraintException))\n            return CreateInstance\u003CUniqueConstraintException\u003E(messageKey);\n\n        if (type == typeof(AccessDeniedException))\n            return CreateInstance\u003CAccessDeniedException\u003E(messageKey);\n\n        if (type == typeof(NotFoundException))\n            return CreateInstance\u003CNotFoundException\u003E(messageKey);\n\n        if (type == typeof(ServiceUnavailableException))\n            return CreateInstance\u003CServiceUnavailableException\u003E(messageKey);\n\n        return CreateInstance\u003CException\u003E(messageKey);\n    }\n\n    private static T CreateInstance\u003CT\u003E(params object[] paramArray)\n    {\n        return (T) Activator.CreateInstance(typeof(T), paramArray);\n    }\n}","tests":[{"id":"41caa1fd-cc4a-b5a5-bb03-70824c717edf","name":"IntegrationTest.EntryPoint.WebApi.Commons.ExceptionHandlerTest.FailToFormatMessageIfKeyNotExistsInTheResourceFile","location":{"start":{"line":21,"column":5},"end":{"line":31,"column":6}}},{"id":"a3ac7837-f28a-f33f-6734-e53d296ab0f5","name":"IntegrationTest.EntryPoint.WebApi.Commons.ExceptionHandlerTest.SuccessfulToFormatMessageIfKeyExistsInTheResourceFileForDefaultCulture","location":{"start":{"line":33,"column":5},"end":{"line":49,"column":6}}},{"id":"8092ffad-478a-fca1-fce2-df4dbb423a88","name":"IntegrationTest.EntryPoint.WebApi.Commons.ExceptionHandlerTest.SuccessfulToFormatMessageIfKeyExistsInTheResourceFileForPtBrCulture","location":{"start":{"line":51,"column":5},"end":{"line":67,"column":6}}},{"id":"f173f4ce-c827-3dfc-3694-3089f5d5032d","name":"IntegrationTest.EntryPoint.WebApi.Commons.ExceptionHandlerTest.SuccessfulToBuildHttpResponseStatus","location":{"start":{"line":69,"column":5},"end":{"line":82,"column":6}}},{"id":"48fc17a7-5bb9-78a9-72a5-bf24d418ea6a","name":"IntegrationTest. ltExecutingContext = new ResultExecutingContext\n        (\n            actionContext,\n            new List\u003CIFilterMetadata\u003E(),\n            new ObjectResult(\u0022A dummy result from the action method.\u0022),\n            Mock.Of\u003CController\u003E()\n        );\n\n        // Act\n        AddCorrelationIdHeaderAttribute addCorrelationIdHeaderAttribute = new AddCorrelationIdHeaderAttribute();\n        addCorrelationIdHeaderAttribute.OnResultExecuting(resultExecutingContext);\n\n        // Assert\n        Assert.Single(resultExecutingContext.HttpContext.Response.Headers);\n        Assert.True(resultExecutingContext.HttpContext.Response.Headers.ContainsKey(\u0022X-Correlation-Id\u0022));\n        Assert.Equal(\u0022d12df24d-1268-42d9-8d0d-d614c8d26299\u0022, resultExecutingContext.HttpContext.Response.Headers[\u0022X-Correlation-Id\u0022]);\n    }\n\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Fact(DisplayName = \u0022Successful to add correlation id to response headers even if request does not contain correlation id\u0022)]\n    public void SuccessfulToAddCorrelationIdToResponseHeadersEvenIfRequestDoesNotContainCorrelationId()\n    {\n        // Arrange\n        ActionContext actionContext = new ActionContext\n        {\n            HttpContext = new DefaultHttpContext(),\n            RouteData = new RouteData(),\n            ActionDescriptor = new ActionDescriptor()\n        };\n\n        ResultExecutingContext resultExecutingContext = new ResultExecutingContext\n        (\n            actionContext,\n            new List\u003CIFilterMetadata\u003E(),\n            new ObjectResult(\u0022A dummy result from the action method.\u0022),\n            Mock.Of\u003CController\u003E()\n        );\n\n        // Act\n        AddCorrelationIdHeaderAttribute addCorrelationIdHeaderAttribute = new AddCorrelationIdHeaderAttribute();\n        addCorrelationIdHeaderAttribute.OnResultExecuting(resultExecutingContext);\n\n        // Assert\n        Assert.Single(resultExecutingContext.HttpContext.Response.Headers);\n        Assert.True(resultExecutingContext.HttpContext.Response.Headers.ContainsKey(\u0022X-Correlation-Id\u0022));\n        Assert.False(string.IsNullOrWhiteSpace(resultExecutingContext.HttpContext.Response.Headers[\u0022X-Correlation-Id\u0022]));\n    }\n\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Fact(DisplayName = \u0022Successful to generate correlation id if it is missing from request headers\u0022)]\n    public void SuccessfulToGenerateCorrelationIdIfItIsMissingFromRequestHeaders()\n    {\n        // Arrange\n        ActionContext actionContext = new ActionContext\n        {\n            HttpContext = new DefaultHttpContext\n            {\n                Request =\n                {\n                    Headers = {new KeyValuePair\u003Cstring, StringValues\u003E(\u0022X-Correlation-Id\u0022, string.Empty)}\n                }\n            },\n            RouteData = new RouteData(),\n            ActionDescriptor = new ActionDescriptor()\n        };\n\n        ResultExecutingContext resultExecutingContext = new ResultExecutingContext\n        (\n            actionContext,\n            new List\u003CIFilterMetadata\u003E(),\n            new ObjectResult(\u0022A dummy result from the action method.\u0022),\n            Mock.Of\u003CController\u003E()\n        );\n\n        // Act\n        AddCorrelationIdHeaderAttribute addCorrelationIdHeaderAttribute = new AddCorrelationIdHeaderAttribute();\n        addCorrelationIdHeaderAttribute.OnResultExecuting(resultExecutingContext);\n\n        // Assert\n        Assert.Single(resultExecutingContext.HttpContext.Response.Headers);\n        Assert.True(resultExecutingContext.HttpContext.Response.Headers.ContainsKey(\u0022X-Correlation-Id\u0022));\n\n        StringValues stringValues = resultExecutingContext.HttpContext.Response.Headers[\u0022X-Correlation-Id\u0022];\n        Assert.Single(stringVal ection [NoContext]\u0022)]\npublic sealed class GetCorrelationIdTest\n{\n    private const string CorrelationIdKey = \u0022X-Correlation-Id\u0022;\n\n    private readonly Mock\u003CIHttpContextAccessor\u003E _httpContextAccessor;\n    private readonly GetCorrelationId _getCorrelationId;\n\n    public GetCorrelationIdTest()\n    {\n        _httpContextAccessor = new Mock\u003CIHttpContextAccessor\u003E(MockBehavior.Strict);\n        _getCorrelationId = new GetCorrelationId(_httpContextAccessor.Object);\n    }\n\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Fact(DisplayName = \u0022Successful to get correlationId from header\u0022)]\n    public void SuccessfulToGetCorrelationIdFromHeader()\n    {\n        // Arrange\n        const string correlationId = \u0022ae4328e9-6fb4-4408-98ee-66634503a0d1\u0022;\n\n        IHeaderDictionary headers = new HeaderDictionary {{CorrelationIdKey, correlationId}};\n        _httpContextAccessor\n            .Setup(httpContextAccessor =\u003E httpContextAccessor.HttpContext.Request.Headers)\n            .Returns(headers);\n\n        // Act\n        string result = _getCorrelationId.Execute();\n\n        // Assert\n        Assert.NotNull(result);\n        Assert.Equal(\u0022ae4328e9-6fb4-4408-98ee-66634503a0d1\u0022, result);\n    }\n\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Fact(DisplayName = \u0022Successful to generate correlation id if it is missing\u0022)]\n    public void SuccessfulToGenerateCorrelationIdIfItIsMissing()\n    {\n        // Arrange\n        IHeaderDictionary headers = new HeaderDictionary {{CorrelationIdKey, string.Empty}};\n\n        _httpContextAccessor\n            .Setup(httpContextAccessor =\u003E httpContextAccessor.HttpContext.Request.Headers)\n            .Returns(headers);\n\n        // Act\n        string correlationId = _getCorrelationId.Execute();\n\n        // Assert\n        Assert.NotNull(correlationId);\n        Assert.Equal(36, correlationId.Length);\n    }\n\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Fact(DisplayName = \u0022Successful to get correlationId If does not exists in context\u0022)]\n    public void SuccessfulToGetCorrelationIdIfDoesNotExistsInContext()\n    {\n        // Arrange\n        IHeaderDictionary headers = new HeaderDictionary();\n        _httpContextAccessor\n            .Setup(httpContextAccessor =\u003E httpContextAccessor.HttpContext.Request.Headers)\n            .Returns(headers);\n\n        // Act\n        string correlationId = _getCorrelationId.Execute();\n\n        // Assert\n        Assert.NotEmpty(correlationId);\n    }\n\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Fact(DisplayName = \u0022Successful to get correlationId If httpContext is null\u0022)]\n    public void SuccessfulToGetCorrelationIdIfHttpContextIsNull()\n    {\n        // Arrange\n        _httpContextAccessor\n            .Setup(httpContextAccessor =\u003E httpContextAccessor.HttpContext)\n            .Returns((HttpContext) null);\n\n        // Act\n        string correlationId = _getCorrelationId.Execute();\n\n        // Assert\n        Assert.NotEmpty(correlationId);\n    }\n}","tests":[{"id":"ba4bb733-ea8e-1808-59e8-9358cc679869","name":"IntegrationTest.EntryPoint.WebApi.Commons.GetCorrelationIdTest.SuccessfulToGetCorrelationIdFromHeader","location":{"start":{"line":22,"column":5},"end":{"line":40,"column":6}}},{"id":"6ff0611d-761a-d6aa-cf49-7212c8c273c0","name":"IntegrationTest.EntryPoint.WebApi.Commons.GetCorrelationIdTest.SuccessfulToGenerateCorrelationIdIfItIsMissing","location":{"start":{"line":42,"column":5},"end":{"line":59,"column":6}}},{"id":"65e2874c-66e1-f5ab-81aa-0ea176e4b7c4","name":"IntegrationTest.EntryPoint.WebApi.Commons.GetCorrelationIdTest.SuccessfulToGetCorrelationIdIfDoesNotExistsInContext","location":{"start":{"line":61,"column":5},"end":{"line":76,"column":6}}},{"id":"417108b4-2c4  System.Collections.Generic;\r\nusing Xunit;\r\nusing Xunit.Abstractions;\r\n\r\nnamespace IntegrationTest.EntryPoint.WebApi.Commons;\r\n\r\n[Collection(\u0022WebApi Collection [NoContext]\u0022)]\r\npublic sealed class GetProjectsByCsprojFileTest(ITestOutputHelper outputHelper)\r\n{\r\n\r\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\r\n    [Fact(DisplayName = \u0022Successful to get projects by csproj file\u0022)]\r\n    public void SuccessfulToGetProjectsByCsprojFile()\r\n    {\r\n        // Arrange\r\n        // Act\r\n        IDictionary\u003Cstring, string\u003E projects = GetProjectsByCsprojFile.Projects;\r\n\r\n        // Assert\r\n        Assert.NotNull(projects);\r\n        Assert.NotEmpty(projects);\r\n        \r\n        foreach (KeyValuePair\u003Cstring, string\u003E project in projects)\r\n        {\r\n            outputHelper.WriteLine($\u0022Project name: {project.Key}\u0022);\r\n            outputHelper.WriteLine($\u0022Project folder: {project.Value}\u0022);\r\n        }\r\n    }\r\n}","tests":[{"id":"a57dd3c1-7569-cad7-77ca-039dd5f1dd8a","name":"IntegrationTest.EntryPoint.WebApi.Commons.GetProjectsByCsprojFileTest.SuccessfulToGetProjectsByCsprojFile","location":{"start":{"line":11,"column":5},"end":{"line":28,"column":6}}}]},"/home/runner/work/querystring-composer-api-netcore/querystring-composer-api-netcore/src/test/IntegrationTest.EntryPoint.WebApi/Commons/LoggerAdapterTest.cs":{"language":"cs","source":"using System;\r\nusing System.Collections.Generic;\r\nusing System.Diagnostics.CodeAnalysis;\r\nusing System.Linq;\r\nusing EntryPoint.WebApi.Commons;\r\nusing Microsoft.Extensions.Logging;\r\nusing Moq;\r\nusing Xunit;\r\n\r\nnamespace IntegrationTest.EntryPoint.WebApi.Commons;\r\n\r\n[Collection(\u0022WebApi Collection [NoContext]\u0022)]\r\n[SuppressMessage(\u0022ReSharper\u0022, \u0022ClassNeverInstantiated.Local\u0022)]\r\npublic sealed class LoggerAdapterTest\r\n{\r\n    private readonly Mock\u003CILogger\u003E _logger;\r\n\r\n    private readonly ILoggerAdapter _loggerAdapter;\r\n\r\n    public LoggerAdapterTest()\r\n    {\r\n        _logger = new Mock\u003CILogger\u003E(MockBehavior.Strict);\r\n\r\n        Mock\u003CILoggerFactory\u003E loggerFactory = new Mock\u003CILoggerFactory\u003E(MockBehavior.Strict);\r\n\r\n        loggerFactory\r\n            .Setup(factory =\u003E factory.CreateLogger(typeof(LoggerAdapterTest).FullName))\r\n            .Returns(_logger.Object);\r\n\r\n        _loggerAdapter = new LoggerAdapter\u003CLoggerAdapterTest\u003E(loggerFactory.Object);\r\n    }\r\n\r\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\r\n    [Fact(DisplayName = \u0022Successful to log an error message\u0022)]\r\n    public void SuccessfulToLogAnErrorMessage()\r\n    {\r\n        // Arrange\r\n        _logger\r\n            .Setup(logger1 =\u003E logger1.IsEnabled(LogLevel.Error))\r\n            .Returns(true);\r\n\r\n        _logger\r\n            .Setup(logger1 =\u003E logger1.Log\r\n                (\r\n                    LogLevel.Error,\r\n                    It.IsAny\u003CEventId\u003E(),\r\n                    It.IsAny\u003CIt.IsAnyType\u003E(),\r\n                    It.IsAny\u003CException\u003E(),\r\n                    It.IsAny\u003CFunc\u003CIt.IsAnyType, Exception, string\u003E\u003E()\r\n                )\r\n            )\r\n            .Verifiable();\r\n\r\n        // Act\r\n        _loggerAdapter.LogError(\u0022An unexpected error has occurred, please try again later\u0022);\r\n\r\n        // Assert\r\n        Assert.True(_loggerAdapter.IsEnabled(LogLevel.Error));\r\n\r\n        _logger.Verify(loggerFactory =\u003E loggerFactory.Log(\r\n                LogLevel.Error,\r\n                It.IsAny\u003CEventId\u003E(),\r\n                It.Is\u003CIt.IsAnyType\u003E((valueObject, _) =\u003E LogMessageMatcher(valueObject, \u0022An unexpected error has occurred, please try again later\u0022)),\r\n                It.IsAny\u003CException\u003E(),\r\n                It.Is\u003CFunc\u003CIt.IsAnyType, Exception, string\u003E\u003E((v, t) =\u003E true)), Times.Once\r\n        );\r\n    }\r\n\r\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\r\n    [Fact(DisplayName = \u0022Successful to log a warning message\u0022)]\r\n    public void SuccessfulToLogAWarningMessage()\r\n    {\r\n        // Arrange\r\n        _logger\r\n            .Setup(logger1 =\u003E logger1.IsEnabled(LogLevel.Warning))\r\n            .Returns(true);\r\n\r\n        _logger\r\n            .Setup(logger1 =\u003E logger1.Log\r\n                (\r\n                    LogLevel.Warning,\r\n                    It.IsAny\u003CEventId\u003E(),\r\n                    It.IsAny\u003CIt.IsAnyType\u003E(),\r\n                    It.IsAny\u003CException\u003E(),\r\n                    It.IsAny\u003CFunc\u003CIt.IsAnyType, Exception, string\u003E\u003E())\r\n            )\r\n            .Verifiable();\r\n\r\n        // Act\r\n        _loggerAdapter.LogWarning(\u0022It doesn\u0027t pay to ignore warnings. Even when they don\u2019t make sense\u0022);\r\n\r\n        // Assert\r\n        Assert.True(_loggerAdapter.IsEnabled(LogLevel.Warning));\r\n\r\n        _logger.Verify(loggerFactory =\u003E loggerFactory.Log(\r\n                LogLevel.Warning,\r\n                It.IsAny\u003CEventId\u003E(),\r\n                It.Is\u003CIt.IsAnyType\u003E((valueObject, _) =\u003E LogMessageMatcher(valueObject, \u0022It doesn\u0027t pay to ignore warnings. Even when they don\u2019t make sense\u0022)),\r\n                It.IsAny\u003CException\u003E(),\r\n                It.Is\u003CFunc\u003CIt.IsAnyType, Exception, string\u003E\u003E((v, t) =\u003E true)), Times.Once\r\n        );\r\n    }\r\n\r\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\r\n    [Fact(DisplayName = \u0022Successful to log an information message\u0022)]\r\n    public void SuccessfulToLogAnInformationMessage()\r\n    {\r\n        // Arrange\r\n        _logger\r\n            .Setup(logger1 =\u003E logger1.IsEnabled(LogLevel.Information))\r\n            .Returns(true);\r\n\r\n        _logger\r\n            .Setup(logger1 =\u003E logger1.Log\r\n                (\r\n                    LogLevel.Information,\r\n                    It.IsAny\u003CEventId\u003E(),\r\n                    It.IsAny\u003CIt.IsAnyType\u003E(),\r\n                    It.IsAny\u003CException\u003E(),\r\n                    It.IsAny\u003CFunc\u003CIt.IsAnyType, Exception, string\u003E\u003E())\r\n            )\r\n            .Verifiable();\r\n\r\n        // Act\r\n        _loggerAdapter.LogInformation(\u0022Information is not knowledge\u0022);\r\n\r\n        // Assert\r\n        Assert.True(_loggerAdapter.IsEnabled(LogLevel.Information));\r\n\r\n        _logger.Verify(loggerFactory =\u003E loggerFactory.Log(\r\n                LogLevel.Information,\r\n                It.IsAny\u003CEventId\u003E(),\r\n                It.Is\u003CIt.IsAnyType\u003E((valueObject, _) =\u003E LogMessageMatcher(valueObject, \u0022Information is not knowledge\u0022)),\r\n                It.IsAny\u003CException\u003E(),\r\n                It.Is\u003CFunc\u003CIt.IsAnyType, Exception, string\u003E\u003E((v, t) =\u003E true)), Times.Once\r\n        );\r\n    }\r\n\r\n    private static bool LogMessageMatcher(object valueObject, string expected)\r\n    {\r\n        IReadOnlyList\u003CKeyValuePair\u003Cstring, object\u003E\u003E loggedValueObject = valueObject as IReadOnlyList\u003CKeyValuePair\u003Cstring, object\u003E\u003E;\r\n        string actual = loggedValueObject!.FirstOrDefault(keyValuePair =\u003E keyValuePair.Key == \u0022{OriginalFormat}\u0022).Value.ToString();\r\n        return actual == expected;\r\n    }\r\n}","tests":[{"id":"75192d30-a340-f961-6caa-9dad427997ce","name":"IntegrationTest.EntryPoint.WebApi.Commons.LoggerAdapterTest.SuccessfulToLogAnErrorMessage","location":{"start":{"line":33,"column":5},"end":{"line":67,"column":6}}},{"id":"79ae9b53-6c3c-5588-5bc5-4b88ad51ccab","name":"IntegrationTest.EntryPoint.WebApi.Commons.LoggerAdapterTest.SuccessfulToLogAWarningMessage","location":{"start":{"line":69,"column":5},"end":{"line":102,"column":6}}},{"id":"d28607c9-867e-09b1-fa44-93637cb222c4","name":"IntegrationTest.EntryPoint.WebApi.Commons.LoggerAdapterTest.SuccessfulToLogAnInformationMessage","location":{"start":{"line":104,"column":5},"end":{"line":137,"column":6}}}]},"/home/runner/work/querystring-composer-api-netcore/querystring-composer-api-netcore/src/test/IntegrationTest.EntryPoint.WebApi/Commons/MessageResourceMappingTest.cs":{"language":"cs","source":"using System.Collections.Generic;\r\nusing System.Diagnostics.CodeAnalysis;\r\nusing System.IO;\r\nusing System.Linq;\r\nusing Core.Commons.Extensions;\r\nusing Xunit;\r\nusing Xunit.Abstractions;\r\n\r\nnamespace IntegrationTest.EntryPoint.WebApi.Commons;\r\n\r\n[Collection(\u0022WebApi Collection [NoContext]\u0022)]\r\npublic sealed class MessageResourceMappingTest(ITestOutputHelper outputHelper, CoreMessageKeysFixture coreMessageKeysFixture) : IClassFixture\u003CCoreMessageKeysFixture\u003E\r\n{\r\n    private static readonly string WebApiProjectFolder = GetProjectsByCsprojFile.Projects[\u0022EntryPoint.WebApi\u0022];\r\n    \r\n    private const string DefaultMessageResourcePath = \u0022Messages.resx\u0022;\r\n    private const string EnUsMessageResourcePath = \u0022Messages.en-US.resx\u0022;\r\n    private const string PtBrMessageResourcePath = \u0022Messages.pt-BR.resx\u0022;\r\n\r\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\r\n    [Theory(DisplayName = \u0022Successful to validate messages mapped in message resources \u0022)]\r\n    [InlineData(DefaultMessageResourcePath)]\r\n    [InlineData(EnUsMessageResourcePath)]\r\n    [InlineData(PtBrMessageResourcePath)]\r\n    public void SuccessfulToValidateMessagesMappedInMessageResources(string messageResource)\r\n    {\r\n        // Arrange\r\n ert.Equal(string.Empty, OrderByHelper.Sanitize([], string.Empty));\n\n        Assert.Equal(string.Empty, OrderByHelper.Sanitize(null, (List\u003Cstring\u003E) null));\n        Assert.Equal(string.Empty, OrderByHelper.Sanitize(null, []));\n        Assert.Equal(string.Empty, OrderByHelper.Sanitize(null, [\u0022Id,Asc\u0022]));\n        Assert.Equal(string.Empty, OrderByHelper.Sanitize(null, (string) null));\n        Assert.Equal(string.Empty, OrderByHelper.Sanitize(null, string.Empty));\n    }\n\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\n    [Theory(DisplayName = \u0022Successful to filter and sanitize several types of orders\u0022)]\n    [InlineData(\u0022field1,ASC,asc,AsC,aSc\u0022, \u0022Field1:ASC\u0022)]\n    [InlineData(\u0022field1,DESC,desc,DesC,dEsC\u0022, \u0022Field1:DESC\u0022)]\n    [InlineData(\u0022Asc,field1,ASC,asc,AsC,aSc\u0022, \u0022Field1:ASC\u0022)]\n    [InlineData(\u0022Desc,field1,DESC,desc,DesC,dEsC\u0022, \u0022Field1:DESC\u0022)]\n    [InlineData(\u0022field1,field3,field5\u0022, \u0022Field1:ASC,Field3:ASC,Field5:ASC\u0022)]\n    [InlineData(\u0022field1,ASC,field3,asc,field5,AsC\u0022, \u0022Field1:ASC,Field3:ASC,Field5:ASC\u0022)]\n    [InlineData(\u0022field1,DESC,field3,desc,field5,DesC\u0022, \u0022Field1:DESC,Field3:DESC,Field5:DESC\u0022)]\n    [InlineData(\u0022 field1 : desc , field2 : asc , field3 , asc \u0022, \u0022Field1:DESC,Field3:ASC\u0022)]\n    [InlineData(\u0022 field1 : asc , field2 : desc , field3 , desc \u0022, \u0022Field1:ASC,Field3:DESC\u0022)]\n    [InlineData(\u0022field1,Desc,field2,Asc,field3,Asc,field5,Asc\u0022, \u0022Field1:DESC,Field3:ASC,Field5:ASC\u0022)]\n    [InlineData(\u0022field1,Asc,field2,Desc,field3,Desc,field5,Desc\u0022, \u0022Field1:ASC,Field3:DESC,Field5:DESC\u0022)]\n    [InlineData(\u0022field1,DESC,field2,ASC,DESC,field3,ASC,DESC,field5\u0022, \u0022Field1:DESC,Field3:ASC,Field5:ASC\u0022)]\n    [InlineData(\u0022field1,ASC,field2,DESC,ASC,field3,DESC,AS t with page number page size\u0022)]\r\n    public void SuccessfulToCreateAnPageRequestWithPageNumberPageSize()\r\n    {\r\n        // Arrange\r\n        // Act\r\n        PageRequest pageRequest = PageRequestHelper.Of(\u00223\u0022, \u00229\u0022, string.Empty);\r\n\r\n        // Assert\r\n        Assert.NotNull(pageRequest);\r\n        Assert.Equal(3, pageRequest.PageNumber);\r\n        Assert.Equal(9, pageRequest.PageSize);\r\n        Assert.NotNull(pageRequest.Sort);\r\n        Assert.Empty(pageRequest.Sort.GetOrders());\r\n    }\r\n\r\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\r\n    [Fact(DisplayName = \u0022Successful to create an PageRequest with default values when parameters are invalid\u0022)]\r\n    public void SuccessfulToCreateAnPageRequestWithDefaultValuesWhenParametersAreInvalid()\r\n    {\r\n        // Arrange\r\n        // Act\r\n        PageRequest pageRequest = PageRequestHelper.Of(\u0022X\u0022, \u0022Y\u0022, string.Empty);\r\n\r\n        // Assert\r\n        Assert.NotNull(pageRequest);\r\n        Assert.Equal(0, pageRequest.PageNumber);\r\n        Assert.Equal(10, pageRequest.PageSize);\r\n        Assert.NotNull(pageRequest.Sort);\r\n        Assert.Empty(pageRequest.Sort.GetOrders());\r\n    }\r\n}","tests":[{"id":"f13d3b85-25e9-057a-51ff-d6ab10b72d03","name":"IntegrationTest.EntryPoint.WebApi.Commons.PageRequestHelperTest.SuccessfulToCreateAnPageRequestWithPageNumberPageSizeAndSort","location":{"start":{"line":10,"column":5},"end":{"line":37,"column":6}}},{"id":"26fe90f5-067e-e30e-8362-45d01e6b792b","name":"IntegrationTest.EntryPoint.WebApi.Commons.PageRequestHelperTest.SuccessfulToCreateAnPageRequestWithPageNumberPageSize","location":{"start":{"line":39,"column":5},"end":{"line":53,"column":6}}},{"id":"3f529d03-61b0-fbc1-1524-c3d0b7b91827","name":"IntegrationTest.EntryPoint.WebApi.Commons.PageRequestHelperTest.SuccessfulToCreateAnPageRequestWithDefaultValuesWhenParametersAreInvalid","location":{"start":{"l ack\u0022, \u0022White\u0022), dummyClass);\r\n    }\r\n\r\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\r\n    [Fact(DisplayName = \u0022Successful to resolve non singleton service\u0022)]\r\n    public void SuccessfulToResolveNonSingletonService()\r\n    {\r\n        // Arrange\r\n        _serviceScope\r\n            .Setup(self =\u003E self.ServiceProvider)\r\n            .Returns(_serviceProvider.Object);\r\n\r\n        _serviceScope\r\n            .Setup(self =\u003E self.Dispose());\r\n\r\n        _serviceScopeFactory\r\n            .Setup(self =\u003E self.CreateScope())\r\n            .Returns(_serviceScope.Object);\r\n\r\n        _serviceProvider\r\n            .Setup(self =\u003E self.GetService(typeof(IServiceScopeFactory)))\r\n            .Returns(_serviceScopeFactory.Object);\r\n\r\n        _serviceProvider\r\n            .Setup(self =\u003E self.GetService(typeof(DummyClass)))\r\n            .Returns(new DummyClass(\u0022Black\u0022, \u0022White\u0022));\r\n\r\n        ServiceResolver serviceResolver = new ServiceResolver();\r\n        serviceResolver.Setup(_serviceProvider.Object);\r\n\r\n        // Act\r\n        DummyClass dummyClass = serviceResolver.Resolve\u003CDummyClass\u003E();\r\n\r\n        // Assert\r\n        Assert.Equal(new DummyClass(\u0022Black\u0022, \u0022White\u0022), dummyClass);\r\n    }\r\n\r\n    [Trait(\u0022Category\u0022, \u0022WebApi Collection [NoContext]\u0022)]\r\n    [Fact(DisplayName = \u0022Fail to resolve singleton service\u0022)]\r\n    public void FailToResolveSingletonService()\r\n    {\r\n        // Arrange\r\n        _serviceProvider\r\n            .Setup(self =\u003E self.GetService(typeof(DummyClass)))\r\n            .Returns(null);\r\n\r\n        Dictionary\u003CType, ServiceLifetime\u003E lifetimeByType = new Dictionary\u003CType, ServiceLifetime\u003E\r\n        {\r\n            {typeof(DummyClass), ServiceLifetime.Transient}\r\n        };\r\n\r\n        ServiceResolver serviceResolver = new ServiceResolver();\r\n        serviceResolver.Setup(_serviceProvider.Object, lifetimeByType);\r\n\r\n        // Act\r\n        // Assert\r\n        Assert.Throws\u003CArgumentNullException\u003E(() =\u003E serviceResolver.Resolve\u003CDummyClass\u003E());\r\n    }\r\n\r\n    [ExcludeFromCodeCoverage]\r\n    private sealed class DummyClass(string foo, string bar)\r\n    {\r\n        public string Foo { get; } = foo;\r\n        public string Bar { get; } = bar;\r\n\r\n        private bool Equals(DummyClass other)\r\n        {\r\n            return Foo == other.Foo \u0026\u0026 Bar == other.Bar;\r\n        }\r\n\r\n        [ExcludeFromCodeCoverage]\r\n        public override bool Equals(object obj)\r\n        {\r\n            return ReferenceEquals(this, obj) || obj is DummyClass other \u0026\u0026 Equals(other);\r\n        }\r\n\r\n        public override int GetHashCode()\r\n        {\r\n            return HashCode.Combine(Foo, Bar);\r\n        }\r\n\r\n        public override string ToString()\r\n        {\r\n            return $\u0022{nameof(Foo)}: {Foo}, {nameof(Bar)}: {Bar}\u0022;\r\n        }\r\n    }\r\n}","tests":[{"id":"65516065-d029-09af-06a9-f50ff7a9e70d","name":"IntegrationTest.EntryPoint.WebApi.Commons.ServiceResolverTest.SuccessfulToResolveSingletonService","location":{"start":{"line":18,"column":5},"end":{"line":40,"column":6}}},{"id":"eeebd9d6-4202-ad7f-86ba-0ca47235c793","name":"IntegrationTest.EntryPoint.WebApi.Commons.ServiceResolverTest.SuccessfulToResolveNonSingletonService","location":{"start":{"line":42,"column":5},"end":{"line":74,"column":6}}},{"id":"0b41f2e3-158d-20e3-131d-88d5cbfd25e7","name":"IntegrationTest.EntryPoint.WebApi.Commons.ServiceResolverTest.FailToResolveSingletonService","location":{"start":{"line":76,"column":5},"end":{"line":96,"column":6}}}]},"/home/runner/work/querystring-composer-api-netcore/querystring-composer-api-netcore/src/test/IntegrationTest.EntryPoint.WebApi/Commons/UrlHelperTest.cs":{"language":"cs e = \u0022POST /v1/compositions/{queryName} return http status 500 [Internal Server Error]\u0022)]\r\n    public async Task FailToBuildQueryStringIfUnexpectedErrorOccurs()\r\n    {\r\n        // Arrange\r\n        _webRequest\r\n            .Setup(webRequest =\u003E webRequest.ClientUid)\r\n            .Returns(\u0022d8e6b367-0a9c-4634-9263-09d85bff0d28\u0022);\r\n\r\n        _useCase\r\n            .Setup(useCase =\u003E useCase.ExecuteAsync(new BuildQueryStringCommand(\u0022d8e6b367-0a9c-4634-9263-09d85bff0d28\u0022, \u0022queryName\u0022, \u0022searchTerms\u0022)))\r\n            .ThrowsAsync(new Exception(\u0022Unexpected error\u0022));\r\n\r\n        // Act\r\n        ObjectResult objectResult = await _invoker.InvokeAsync\r\n        (\r\n            () =\u003E _apiMethod.BuildQueryString(new BuildQueryStringRequest\r\n                {\r\n                    QueryName = \u0022queryName\u0022,\r\n                    Body = new BuildQueryStringRequestBody {SearchTerms = \u0022searchTerms\u0022}\r\n                }\r\n            )\r\n        );\r\n\r\n        // Assert\r\n        Assert.NotNull(objectResult);\r\n        Assert.Equal((int) HttpStatusCode.InternalServerError, objectResult.StatusCode);\r\n\r\n        JsonElement jsonElement = ApiMethodTestHelper.TryGetJsonElement(objectResult);\r\n\r\n        const string errorMessage = \u0022An unexpected error has occurred, please try again later!\u0022;\r\n\r\n        JsonAssertHelper.AssertThat(jsonElement)\r\n            .AndExpectThat(JsonFrom.Path(\u0022$.code\u0022), Is\u003Cint\u003E.EqualTo(500))\r\n            .AndExpectThat(JsonFrom.Path(\u0022$.message\u0022), Is\u003Cstring\u003E.EqualTo(errorMessage))\r\n            .AndExpectThat(JsonFrom.Path(\u0022$.fields\u0022), Is\u003Cobject\u003E.Empty());\r\n    }\r\n\r\n    [UseCulture(\u0022en-US\u0022)]\r\n    [Trait(\u0022Category\u0022, \u0022Entrypoint (WebApi) Integration tests\u0022)]\r\n    [Fact(DisplayName = \u0022POST /v1/compositions/{queryName} ame = \u0022POST /v1/compositions/{queryName} return http status 200 [OK]\u0022)]\r\n    public async Task SuccessToBuildQueryString()\r\n    {\r\n        // Arrange\r\n        _webRequest\r\n            .Setup(webRequest =\u003E webRequest.ClientUid)\r\n            .Returns(\u0022d8e6b367-0a9c-4634-9263-09d85bff0d28\u0022);\r\n\r\n        _useCase\r\n            .Setup(useCase =\u003E useCase.ExecuteAsync(new BuildQueryStringCommand(\u0022d8e6b367-0a9c-4634-9263-09d85bff0d28\u0022, \u0022queryName\u0022, \u0022searchTerms\u0022)))\r\n            .ReturnsAsync\r\n            (\r\n                new Output\r\n                {\r\n                    ClientUid = \u0022d8e6b367-0a9c-4634-9263-09d85bff0d28\u0022,\r\n                    QueryName = \u0022queryName\u0022,\r\n                    SearchTerms = \u0022searchTerms\u0022,\r\n                    QueryString = \u0022?q=searchTerms\u0022,\r\n                    CreatedByAi = false,\r\n                    CreatedAt = new DateTime(2023, 08, 04, 17, 21, 30, DateTimeKind.Local),\r\n                }\r\n            );\r\n\r\n        // Act\r\n        ObjectResult objectResult = await _invoker.InvokeAsync\r\n        (\r\n            () =\u003E _apiMethod.BuildQueryString(new BuildQueryStringRequest\r\n                {\r\n                    QueryName = \u0022queryName\u0022,\r\n                    Body = new BuildQueryStringRequestBody {SearchTerms = \u0022searchTerms\u0022}\r\n                }\r\n            )\r\n        );\r\n\r\n        // Assert\r\n        Assert.NotNull(objectResult);\r\n        Assert.Equal((int) HttpStatusCode.OK, objectResult.StatusCode);\r\n\r\n        JsonElement jsonElement = ApiMethodTestHelper.TryGetJsonElement(objectResult);\r\n\r\n        JsonAssertHelper.AssertThat(jsonElement)\r\n            .AndExpectThat(JsonFrom.Path(\u0022$.clientUid\u0022), Is\u003Cstring\u003E.EqualTo(\u0022d8e6b367-0a9c-4634-9263-09d85bff0d28\u0022))\r\n            .AndExpectThat(JsonFrom.Path(\u0022$.queryName\u0022), Is\u003Cstring\u003E.EqualTo(\u0022queryName\u0022))\r\n            .AndExpectThat(JsonFrom.Path(\u0022$.searchTerms\u0022), Is\u003Cstring\u003E.EqualTo(\u0022searchTerms\u0022))\r\n            .AndExpectThat(JsonFrom.Path(\u0022$.queryString\u0022), Is\u003Cstring\u003E.EqualTo(\u0022?q=searchTerms\u0022))\r\n            .AndExpectThat(JsonFrom.Path(\u0022$.createdByAi\u0022), Is\u003Cstring\u003E.EqualTo(\u0022No\u0022))\r\n            .AndExpectThat(JsonFrom.Path(\u0022$.createdAt\u0022), Is\u003Cstring\u003E.EqualTo(\u00222023-08-04T17:21:30.000\u0022));\r\n    }\r\n}","tests":[{"id":"d6305be7-95e2-d9d0-2192-715179508d39","name":"IntegrationTest.EntryPoint.WebApi.Domains.QueryString.EntryPoints.BuildQueryStringApiMethodTest.FailToBuildQueryStringIfUnexpectedErrorOccurs","location":{"start":{"line":59,"column":5},"end":{"line":96,"column":6}}},{"id":"35278414-0981-f3df-79ac-7135033dd05b","name":"IntegrationTest.EntryPoint.WebApi.Domains.QueryString.EntryPoints.BuildQueryStringApiMethodTest.FailToBuildQueryStringIfSearchTermsIsNotProvided","location":{"start":{"line":98,"column":5},"end":{"line":134,"column":6}}},{"id":"3b513e68-0c47-3bc4-2a91-aadccb302c1e","name":"IntegrationTest.EntryPoint.WebApi.Domains.QueryString.EntryPoints.BuildQueryStringApiMethodTest.SuccessToBuildQueryString","location":{"start":{"line":136,"column":5},"end":{"line":185,"column":6}}}]},"/home/runner/work/querystring-composer-api-netcore/querystring-composer-api-netcore/src/test/IntegrationTest.EntryPoint.WebApi/Properties/AssemblyInfo.cs":{"language":"cs","source":"using Xunit;\n\n[assembly: CollectionBehavior(DisableTestParallelization = true)]","tests":[]}},"thresholds":{"high":80,"low":60}};
